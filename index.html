<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeCraft Pro - 商业简历生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="brand-panel">
        <div class="badge">商业版</div>
        <h1>ResumeCraft Pro</h1>
        <p>输入基本信息，1 分钟生成可打印、高颜值、专业简历 PDF。</p>
        <ul>
          <li>✨ 精美双栏模板</li>
          <li>🖨️ A4 可打印排版</li>
          <li>📄 一键导出 PDF</li>
          <li>🔒 本地处理更安全</li>
        </ul>
      </aside>

      <main class="main-content">
        <header>
          <h2>简历信息录入</h2>
          <p>请尽量完整填写，导出后可直接投递或打印。</p>
        </header>

        <form id="resumeForm" class="resume-form">
          <section class="card">
            <h3>基本信息</h3>
            <div class="grid two">
              <label>
                姓名
                <input name="name" required placeholder="例如：张三" />
              </label>
              <label>
                应聘岗位
                <input name="title" required placeholder="例如：高级产品经理" />
              </label>
              <label>
                手机号
                <input name="phone" required placeholder="例如：13800000000" />
              </label>
              <label>
                邮箱
                <input name="email" type="email" required placeholder="例如：name@email.com" />
              </label>
              <label>
                所在城市
                <input name="city" placeholder="例如：上海" />
              </label>
              <label>
                个人网站 / 作品集
                <input name="website" placeholder="例如：https://portfolio.com" />
              </label>
            </div>
          </section>

          <section class="card">
            <h3>职业概述</h3>
            <label>
              个人简介
              <textarea
                name="summary"
                rows="4"
                placeholder="例如：8年互联网经验，擅长增长策略、B端产品设计与跨部门协作，主导过从0到1的商业化项目。"
              ></textarea>
            </label>
          </section>

          <section class="card">
            <h3>教育背景</h3>
            <label>
              教育经历（每行一条）
              <textarea
                name="education"
                rows="4"
                placeholder="例如：\n2014-2018 同济大学 市场营销 本科\n2018-2020 复旦大学 MBA"
              ></textarea>
            </label>
          </section>

          <section class="card">
            <h3>工作经历</h3>
            <label>
              工作经历（每段一条，空行分隔）
              <textarea
                name="experience"
                rows="8"
                placeholder="例如：\n2023-至今 | XX科技 | 高级产品经理\n- 负责支付增长模块，半年付费率提升32%\n- 搭建数据看板，决策周期缩短40%\n\n2020-2023 | YY互联网 | 产品经理\n- 主导会员体系重构，次月留存提升18%"
              ></textarea>
            </label>
          </section>

          <section class="card">
            <h3>技能与项目</h3>
            <label>
              核心技能（用逗号分隔）
              <input name="skills" placeholder="例如：产品规划, 数据分析, Axure, SQL, AI工作流" />
            </label>
            <label>
              项目亮点（每行一条）
              <textarea
                name="projects"
                rows="5"
                placeholder="例如：\n智能客服平台：上线3个月人工成本下降25%\n增长实验系统：支持AB测试，转化率提升15%"
              ></textarea>
            </label>
          </section>

          <div class="actions">
            <button type="button" id="previewBtn" class="btn ghost">预览数据</button>
            <button type="submit" class="btn primary">生成 PDF 简历</button>
          </div>
        </form>

        <section class="preview card" id="previewBox">
          <h3>预览</h3>
          <p>点击“预览数据”查看将导出到 PDF 的内容。</p>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
