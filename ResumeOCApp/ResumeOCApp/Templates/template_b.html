<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif;background:#f0f2f4;color:#121212}
    .sheet{max-width:1120px;margin:0 auto;background:#eceff2}
    .top{background:#2f435a;color:#fff;padding:34px 70px;display:flex;justify-content:space-between;gap:20px}
    .name{font-size:68px;line-height:1;font-weight:300;letter-spacing:2px}
    .intent{font-size:54px;margin-top:24px;font-weight:500}
    .contact{font-size:46px;line-height:1.6;text-align:left}
    .body{padding:20px 0 28px}
    .row{display:grid;grid-template-columns:320px 1fr;align-items:center;margin:14px 0 0}
    .tag{margin-left:4px;background:#2f435a;color:#fff;font-size:56px;padding:14px 0 16px 92px;clip-path:polygon(0 0, 100% 0, 92% 100%, 0 100%)}
    .bar{height:96px;background:#d3d6d9;margin-left:24px;clip-path:polygon(2% 0, 100% 0, 98% 100%, 0 100%)}
    .content{padding:10px 70px 0;font-size:46px;line-height:1.7}
    .content ul{margin:0;padding-left:44px}.content li{margin:8px 0}
    @media (max-width:1300px){
      .name{font-size:42px}.intent{font-size:34px}.contact{font-size:28px}
      .tag{font-size:32px;padding:10px 0 12px 42px}.bar{height:62px}
      .content{font-size:28px;padding:8px 26px 0}
      .row{grid-template-columns:220px 1fr}
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="top">
      <div>
        <div class="name">{{name}}</div>
        <div class="intent">求职意向：{{role}}</div>
      </div>
      <div class="contact">
        <div>☎ {{phone}}</div>
        <div>✉ {{email}}</div>
        <div>📍 {{city}}</div>
      </div>
    </header>

    <div class="body">
      <div class="row"><div class="tag">基本信息</div><div class="bar"></div></div>
      <div class="content">
        <ul>
          <li>作品集：{{portfolio}}</li>
          <li>个人简介：{{summary}}</li>
        </ul>
      </div>

      <div class="row"><div class="tag">教育背景</div><div class="bar"></div></div>
      <div class="content"><ul>{{education_list}}</ul></div>

      <div class="row"><div class="tag">实习经历</div><div class="bar"></div></div>
      <div class="content"><ul>{{experiences_list}}</ul></div>

      <div class="row"><div class="tag">技能证书</div><div class="bar"></div></div>
      <div class="content"><ul>{{skills_list}}</ul></div>

      <div class="row"><div class="tag">个人荣誉 / 项目</div><div class="bar"></div></div>
      <div class="content"><ul>{{projects_list}}</ul></div>
    </div>
  </div>
</body>
</html>
